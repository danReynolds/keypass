name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.11.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os != 'Windows'
        run: bash tool/install_hardware_build_deps.sh
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test example tool hook demo/provider_app/lib/store.dart
      - run: dart analyze --fatal-infos
      - run: dart test
      - if: runner.os != 'Windows'
        run: python3 tool/test_build_hooks.py
      - run: node --test test/browser/ceremony.test.mjs test/browser/failure.test.mjs test/browser/gesture.test.mjs test/browser/deadline.test.mjs
      - run: dart run example/keypass_example.dart
      - if: runner.os == 'macOS'
        run: xcrun swiftc -typecheck native/apple/PlatformPrfProbe.swift

  apple-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native/apple
      - name: iOS simulator and device SDK compilation
        run: |
          xcrun swiftc -swift-version 5 -typecheck -target arm64-apple-ios18.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" native/apple/Keypass.swift
          xcrun swiftc -swift-version 5 -typecheck -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" native/apple/Keypass.swift

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the removed legacy "tools" SDK package.
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: native/android/gradlew -p native/android testDebugUnitTest assembleRelease :smoke:assembleDebug
      - run: native/android/gradlew -p native/hardware_android assembleRelease testDebugUnitTest
      - name: Android hardware broker ownership and cancellation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/hardware_android/test/broker_test.cpp -o /tmp/keypass-android-broker-test
          /tmp/keypass-android-broker-test

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/windows -B build/windows
      - run: cmake --build build/windows --config Release


  hardware-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install libfido2 openssl@3 cmake pkgconf
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
      - run: cmake -S native/hardware -B build/hardware -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/hardware -j4
      - run: ctest --test-dir build/hardware --output-on-failure

  hardware-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tool/validation/hardware.Dockerfile -t keypass-hardware-validation .

  hardware-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native/hardware_apple
      - name: Compile iPhone NFC adapter with simulator SDK
        run: |
          swift build --package-path native/hardware_apple --triple arm64-apple-ios18.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
