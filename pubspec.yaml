name: keypass
description: Flutter-free Dart access to passkey-derived encryption secrets.
version: 0.1.0-dev.2
repository: https://github.com/danReynolds/keypass
issue_tracker: https://github.com/danReynolds/keypass/issues

environment:
  sdk: ^3.11.0

dev_dependencies:
  cryptography: 2.9.0 # Demo/probe encryption only; no SDK runtime dependency.
  lints: ^6.1.0
  test: ^1.31.0
dependencies:
  pointycastle: 4.0.0
  ffi: ^2.2.0
  hooks: 2.0.2
  code_assets: 1.2.1
